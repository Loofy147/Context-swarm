name: SCS contract tests

concurrency:
  group: scs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reference-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test validators
        run: python -m pip install -r requirements-dev.txt
      - name: Run swarm contract and reference tests
        run: python -m unittest discover -s tests -v
